<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội dung 5 Vững</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body { 
            /* Sử dụng 'Times New Roman' làm font chính, dự phòng là 'serif' */
            font-family: 'Times New Roman', serif; 
            padding: 15px; 
            line-height: 1.6; 
            color: #333; /* Thêm màu chữ mặc định dễ đọc */
            max-width: 600px; /* Giới hạn chiều rộng nội dung trên màn hình lớn */
            margin: auto; /* Căn giữa nội dung */
        }
        img { 
            width: 100%; 
            height: auto; 
            border-radius: 8px; 
            margin: 10px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            display: block; /* Giúp ảnh đứng riêng một hàng */
        }
        h2 { 
            color: #d32f2f; 
            text-align: center; 
            font-weight: 700; /* Đảm bảo tiêu đề in đậm */
        }
        p {
            text-align: center; /* Căn giữa đoạn mô tả */
            font-style: italic; /* In nghiêng đoạn mô tả */
        }
    </style>
</head>
<body>
    <h2>NỘI DUNG <br>"2 KIÊN ĐỊNH, 2 ĐẨY MẠNH, 2 NGĂN NGỪA"</h2>
    <p>Theo chỉ đạo của Tổng Bí thư Tô Lâm, Bí thư Quân ủy Trung ương<br>tại Đại hội đại biểu Đảng bộ Quân đội lần thứ XII</p>
    
     <img src="1.jpg" alt="Hình ảnh 1 minh họa nội dung tổng quát">
    <img src="2.jpg" alt="Hình ảnh 2 minh họa nội dung 2 kiên định">
    <img src="3.jpg" alt="Hình ảnh 3 minh họa nội dung 2 đẩy mạnh">
    <img src="4.jpg" alt="Hình ảnh 4 minh họa nội dung 2 ngăn ngừa">
    </body>
</html>
